[workspace]
resolver = "2"
members = ["velo", "velo-openapi", "velo-macros", "examples/basic"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kelleyblackmore/velo"
authors = ["Kelley Blackmore"]

[workspace.dependencies]
velo = { path = "velo", version = "0.1.0" }
velo-openapi = { path = "velo-openapi", version = "0.1.0" }
velo-macros = { path = "velo-macros", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "tokio"] }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "time", "signal", "sync"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pin-project-lite = "0.2"
percent-encoding = "2"
serde_urlencoded = "0.7"
mime = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
